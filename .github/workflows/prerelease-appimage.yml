---
name: Prerelease - Linux AppImage

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-${{ inputs.ci_version }}
          path: dist

      - name: Publish GitHub prerelease
        env:
          CI_VERSION: ${{ inputs.ci_version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="appimage-prerelease-${CI_VERSION}"
          release_name="Moonlight AppImage prerelease ${CI_VERSION}"
          appimage="dist/Moonlight-${CI_VERSION}-x86_64.AppImage"

          if [[ ! -f "${appimage}" ]]; then
            echo "Expected AppImage not found: ${appimage}" >&2
            find dist -maxdepth 2 -type f -print >&2
            exit 1
          fi

          notes_file="$(mktemp)"
          {
            echo "Automatic AppImage prerelease for commit ${GITHUB_SHA}."
            echo
            echo "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}."
          } > "${notes_file}"

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${appimage}" --clobber
            gh release edit "${release_tag}" \
              --title "${release_name}" \
              --notes-file "${notes_file}" \
              --prerelease
          else
            gh release create "${release_tag}" "${appimage}" \
              --title "${release_name}" \
              --notes-file "${notes_file}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
